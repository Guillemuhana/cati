<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Numera · Presupuestos profesionales en minutos</title>
    <meta
      name="description"
      content="Hacé presupuestos prolijos y mandalos en PDF por WhatsApp o email. Clientes, ítems, condiciones y seguimiento de aceptados, en una sola app. Probalo gratis."
    />
    <meta name="theme-color" content="#1B3B6F" />
    <meta name="robots" content="index, follow" />

    <!--
      Vista previa del link (WhatsApp, Facebook, X, Slack).
      Esos robots NO ejecutan JavaScript: solo leen lo que está escrito
      acá. Por eso estas etiquetas son fijas y describen la portada,
      aunque el resto de los títulos los ponga src/lib/seo.js.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Numera" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="Numera · Presupuestos profesionales en minutos" />
    <meta
      property="og:description"
      content="Hacé presupuestos prolijos y mandalos en PDF por WhatsApp o email. Probalo gratis."
    />
    <!--
      La imagen de la vista previa va con la dirección COMPLETA, no
      relativa: WhatsApp y Facebook no resuelven rutas contra el sitio
      cuando leen estas etiquetas, así que con «/logo-numera.png» el
      link se compartía sin logo.

      Y va una imagen de 1200x630, que es la medida que piden para la
      tarjeta grande. El logo suelto mide 335x150: aunque cargara,
      quedaba una franja diminuta al costado del texto.
    -->
    <meta property="og:url" content="https://numera-presupuestos.vercel.app/" />
    <meta property="og:image" content="https://numera-presupuestos.vercel.app/og-numera.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Numera" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Numera · Presupuestos profesionales en minutos" />
    <meta
      name="twitter:description"
      content="Hacé presupuestos prolijos y mandalos en PDF por WhatsApp o email. Probalo gratis."
    />
    <meta name="twitter:image" content="https://numera-presupuestos.vercel.app/og-numera.png" />

    <!-- Ficha para el buscador: qué es la app, para qué sirve y qué sale. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Numera",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "inLanguage": "es-AR",
        "description": "App para hacer presupuestos profesionales en PDF, con clientes, catálogo de ítems, condiciones de pago y seguimiento de aceptados.",
        "featureList": [
          "Presupuestos en PDF con tu logo",
          "Envío por WhatsApp o email",
          "Enlace público para que el cliente acepte o rechace",
          "Clientes y catálogo de productos",
          "Reportes de aceptación"
        ],
        "offers": {
          "@type": "Offer",
          "category": "free trial"
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/numera-icon.png" />
    <!--
      Para cuando alguien guarda la app en la pantalla de inicio del
      celular. Sin esto, iPhone pone una captura de la pantalla en vez
      del logo y queda un cuadradito ilegible entre las otras apps.
    -->
    <link rel="apple-touch-icon" href="/numera-icon.png" />
  </head>
  <body class="bg-paper text-ink font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
